name: 📊 Weekly Report Upload

on:
  # 每周二上午9点自动运行（与周报生成时间匹配）
  schedule:
    - cron: '0 9 * * 2'
  # 手动触发
  workflow_dispatch:
    inputs:
      report_date:
        description: '周报日期 (YYYYMMDD格式，留空则自动检测最新)'
        required: false
        default: ''
      use_visual:
        description: '上传可视化版本'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  upload-report:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: 📁 Find and upload report
        run: |
          set -e

          REPORT_DATE="${{ github.event.inputs.report_date }}"
          USE_VISUAL="${{ github.event.inputs.use_visual }}"

          # 如果没有指定日期，查找最新的
          if [ -z "$REPORT_DATE" ]; then
            if [ "$USE_VISUAL" = "true" ]; then
              REPORT_FILE=$(ls -1t OS交互设计部周报_*_visual.html 2>/dev/null | head -1)
            else
              REPORT_FILE=$(ls -1t OS交互设计部周报_*.html 2>/dev/null | grep -v "_visual" | head -1)
            fi
          else
            if [ "$USE_VISUAL" = "true" ]; then
              REPORT_FILE="OS交互设计部周报_${REPORT_DATE}_visual.html"
            else
              REPORT_FILE="OS交互设计部周报_${REPORT_DATE}.html"
            fi
          fi

          if [ -z "$REPORT_FILE" ] || [ ! -f "$REPORT_FILE" ]; then
            echo "❌ 未找到周报文件"
            ls -la *.html 2>/dev/null || echo "目录下无HTML文件"
            exit 1
          fi

          echo "📄 准备上传: $REPORT_FILE"

          # 提取日期
          FILE_DATE=$(echo "$REPORT_FILE" | grep -oE '[0-9]{8}' | head -1)
          FORMAT_DATE="${FILE_DATE:0:4}-${FILE_DATE:4:2}-${FILE_DATE:6:2}"

          # 判断类型
          if [[ "$REPORT_FILE" == *"_visual"* ]]; then
            COMMIT_PREFIX="🎨"
            COMMIT_TYPE="可视化版"
          else
            COMMIT_PREFIX="📊"
            COMMIT_TYPE="标准版"
          fi

          # Git操作
          git add "$REPORT_FILE"

          if git diff --cached --quiet; then
            echo "⚠️ 文件未变更，跳过提交"
            exit 0
          fi

          git commit -m "${COMMIT_PREFIX} 周报 ${FORMAT_DATE} (${COMMIT_TYPE})

- 文件: ${REPORT_FILE}
- 生成时间: $(date '+%Y-%m-%d %H:%M:%S')
- 类型: ${COMMIT_TYPE}

🤖 Generated with [Claude Code](https://claude.com/claude-code)"

          git push

          echo "✅ 周报上传成功: $REPORT_FILE"

      - name: 📋 Update README
        run: |
          LATEST_REPORT=$(ls -1t OS交互设计部周报_*.html 2>/dev/null | head -1)
          if [ -n "$LATEST_REPORT" ]; then
            echo "最新周报: $LATEST_REPORT"
          fi
